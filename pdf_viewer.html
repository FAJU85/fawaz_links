<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السيرة الذاتية | Fawaz Al-Jubaili CV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/main.css">
    <script id="chatway" async="true" src="https://cdn.chatway.app/widget.js?id=kWWXFggOP7oR"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }
        .viewer-header {
            padding: 12px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            z-index: 20;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }
        .viewer-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .viewer-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: calc(100% - 64px);
            background: #0F172A;
        }
        .pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: var(--transition);
            white-space: nowrap;
        }
        .back-link:hover {
            color: var(--primary);
        }
        .viewer-banner {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            z-index: 15;
            font-size: 0.8rem;
            color: var(--text);
            white-space: nowrap;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <header class="viewer-header">
        <a href="index.html" class="back-link">
            <!-- In RTL, Back points rightward -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            <span>الملف الشخصي / Back</span>
        </a>

        <div class="viewer-actions">
            <a href="#" target="_blank" id="direct-btn" class="btn btn-secondary" style="width: auto; padding: 8px 14px; font-size: 0.8rem; gap: 6px; border-radius: 10px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                <span>نافذة جديدة</span>
            </a>
            <a href="#" download id="download-btn" class="btn btn-primary" style="width: auto; padding: 8px 16px; font-size: 0.8rem; gap: 6px; border-radius: 10px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>تحميل PDF</span>
            </a>
        </div>
    </header>

    <div class="viewer-container" id="viewer-container">
        <iframe id="pdf-frame" class="pdf-frame" title="Fawaz Al-Jubaili CV"></iframe>

        <div class="viewer-banner" id="viewer-banner">
            <span>📄 إذا لم يظهر الملف تلقائياً على جهازك:</span>
            <a href="#" target="_blank" id="banner-direct-link" style="color: var(--primary); font-weight: 700; text-decoration: underline;">اضغط هنا لفتحه مباشرة</a>
        </div>
    </div>

    <script>
        (function() {
            // Theme setup
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);

            let cvUrl = "/assets/fawaz_aljubaili_cv.pdf";
            try {
                const stored = localStorage.getItem('cms_data');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (parsed && parsed.cv_url && parsed.cv_url.trim()) {
                        cvUrl = parsed.cv_url.trim();
                    }
                }
            } catch (e) {
                console.warn("Could not read local cms_data, using default CV URL");
            }

            const frame = document.getElementById('pdf-frame');
            const downloadBtn = document.getElementById('download-btn');
            const directBtn = document.getElementById('direct-btn');
            const bannerDirectLink = document.getElementById('banner-direct-link');

            const isLocal = cvUrl.startsWith('/assets/') || cvUrl.startsWith('./assets/') || cvUrl.startsWith('/') || !cvUrl.startsWith('http');
            
            let displayUrl = cvUrl;
            if (!isLocal && (cvUrl.startsWith('http://') || cvUrl.startsWith('https://'))) {
                displayUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(cvUrl)}&embedded=true`;
            }

            frame.src = displayUrl;
            downloadBtn.href = cvUrl;
            downloadBtn.setAttribute('download', 'Fawaz_AlJubaili_CV.pdf');
            directBtn.href = cvUrl;
            bannerDirectLink.href = cvUrl;
        })();
    </script>
</body>
</html>
